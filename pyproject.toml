[project]
name = "django-orm-n1-benchmark"
version = "0.1.0"
description = "Benchmark do problema de N+1 queries no ORM do Django e das estratégias select_related e prefetch_related"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.5",
    "django-debug-toolbar>=6.3.0",
    "django-filter>=25.2",
    "djangorestframework>=3.17.1",
    "markdown>=3.10.2",
    "faker>=23.0.0",
    "django-environ>=0.9.0",
    "psycopg[binary]>=3.2",
    "pandas>=3.1.1",
]
